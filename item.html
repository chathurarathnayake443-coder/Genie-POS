<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/images/genie.png">
    <title>Genie - Customers</title>
    <style>
        body{
            overflow-x: hidden;
            font-family: "Poppins", sans-serif;
        }
        header{
            background-color: white;
        }
        #form{
            background-color: rgb(242, 242, 242);
            border-radius: 30px;
            width: 500px;
        }
        main{
            position: relative;
            overflow: hidden;
        }
        footer{
            background-color: rgb(242, 242, 242);
        }
        #table-div{
            padding: 2px;
            position: relative;
            align-self: center;
            border: 2px solid black;
            border-radius: 30px;
            width: 90%;
        }
    </style>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Forum&family=Outfit:wght@100..900&family=Ovo&family=Petit+Formal+Script&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

<body class="pt-5">
<header class="position-fixed top-0 start-0 end-0 z-3">
    <nav class="navbar navbar-expand-md navbar-light shadow-sm">
        <div class="container-xxl">
            <a href="#intro" class="navbar-brand">
                <img src="assets/images/genie.png" width="50px" alt="Genie Logo">
                <span class="fw-bold text-secondary">
                Genie
            </span>
            </a>
            <!--        toggle btn for mobile nav-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!--        navbar links-->
            <div class="collapse navbar-collapse justify-content-end align-center" id="main-nav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="#manage" class="nav-link">DashBoard</a>
                    </li>
                    <li class="nav-item">
                        <a href="#what-we" class="nav-link">Customers</a>
                    </li>
                    <li class="nav-item">
                        <a href="#what-we" class="nav-link">Items</a>
                    </li>
                    <li class="nav-item">
                        <a href="#contact" class="nav-link">Place Order</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<main>
    <form id="form" class="position-relative p-5 shadow-lg mx-auto mt-5">
        <p class="lead fw-bold text-black text-center">Customer Form</p>
        <div class="mb-3">
            <label for="customer_id_input" class="form-label">ID</label>
            <input type="number" class="form-control" id="customer_id_input">
        </div>
        <div class="mb-3">
            <label for="customer_name_input" class="form-label">Name</label>
            <input type="text" class="form-control" id="customer_name_input">
        </div>
        <div class="mb-3">
            <label for="customer_phone_input" class="form-label">Contact Number</label>
            <input type="text" class="form-control" id="customer_phone_input">
        </div>
        <div class="mb-3">
            <label for="customer_address_input" class="form-label">Address</label>
            <input type="text" class="form-control" id="customer_address_input">
        </div>
        <div class="d-flex justify-content-center mt-5">
            <button type="button" id="customer_save_btn" class="btn btn-outline-success rounded ps-3 pe-3 ms-2">Save</button>
            <button type="button" id="customer_update_btn" class="btn btn-outline-primary rounded ps-3 pe-3 ms-2">Update</button>
            <button type="button" id="customer_delete_btn" class="btn btn-outline-danger rounded ps-3 pe-3 ms-2">Delete</button>
            <button type="button" id="customer_reset_btn" class="btn btn-outline-warning rounded ps-3 pe-3 ms-2">Reset</button>
        </div>
    </form>

    <div id="table-div" class="mt-5 mb-5 mx-auto p-5">
        <h2 class="display-6 fw-bold">Customers</h2>
        <table class="table table-hover mx-auto mt-5 border-rounded">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Contact Number</th>
                <th scope="col">Address</th>
            </tr>
            </thead>
            <tbody id="customer_tbody">

            </tbody>
        </table>
    </div>

</main>
<footer>
    <nav id="contact" class="navbar navbar-expand-md navbar-light shadow-sm">
        <div class="container-xxl">
            <span class="text-black">Genie V1.0.0</span>
            <span class="text-secondary">© CSR .Inc @ 2026</span>
            <span>
                <span class="fw-bold text-black">
                Developed By
            </span>
                <img src="assets/images/csr-logo.png" width="50px" alt="Genie Logo">
            </span>
        </div>
    </nav>
</footer>
<script src="assets/lib/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    // customer array
    let customer_db_array = [];

    // customer regex
    const phone_regex = new RegExp("^[0]{1}[7]{1}[01245678]{1}[0-9]{7}$");

    // save customer
    $('#customer_save_btn').on('click', function(){
        let customer_id = $('#customer_id_input').val();
        let customer_name = $('#customer_name_input').val();
        let customer_phone = $('#customer_phone_input').val();
        let customer_address = $('#customer_address_input').val();

        (customer_id == "")? alert('ID Missing') : (customer_name == "")? alert('Name Missing') : !phone_regex.test(customer_phone)? alert('Invalid Phone Number') : (customer_address == "") ? alert('Address Missing') : addToCustomers(customer_id,customer_name,customer_phone,customer_address);
    })

    const addToCustomers = (id,name,phone,address) => {
        let customer = {
            id: id,
            name: name,
            phone: phone,
            address: address,
        }

        customer_db_array.push(customer);
        loadCustomerTable();
        $('#customer_reset_btn').trigger('click');
    }

    const loadCustomerTable = () => {
        $('#customer_tbody').empty();

        customer_db_array.map((item,index) => {
            let data = `${item.id},${item.name},${item.phone},${item.address}`;
            let newRow = `<tr data-index="${data}"><td>${item.id}</td><td>${item.name}</td><td>${item.phone}</td><td>${item.address}</td></tr>`;
            $('#customer_tbody').append(newRow);
        })

    }

    //customer update
    $('#customer_update_btn').on('click', function(){
        let customer_id = $('#customer_id_input').val();
        let customer_name = $('#customer_name_input').val();
        let customer_phone = $('#customer_phone_input').val();
        let customer_address = $('#customer_address_input').val();

        (customer_id == "")? alert('ID Missing') : (customer_name == "")? alert('Name Missing') : !phone_regex.test(customer_phone)? alert('Invalid Phone Number') : (customer_address == "") ? alert('Address Missing') : updateCustomers(customer_id,customer_name,customer_phone,customer_address);
    })

    const updateCustomers = (customer_id,customer_name,customer_phone,customer_address) => {
        let obj = customer_db_array.find((item,index) => item.id == customer_id);

        if(obj){
            obj.id = customer_id;
            obj.name = customer_name;
            obj.phone = customer_phone;
            obj.address = customer_address;
        }

        loadCustomerTable();
        $('#customer_reset_btn').trigger('click');
    }

    //customer delete
    $('#customer_delete_btn').on('click', function(){
        let customer_id = $('#customer_id_input').val();

        (customer_id == "")? alert('ID Missing') : (!getCustomerDataById(customer_id)) ? alert('Customer Not Found') : deleteCustomer(customer_id);
    })

    const deleteCustomer = (customer_id) => {
        let index = customer_db_array.findIndex((item,index) => item.id == customer_id);
        customer_db_array.splice(index, 1);

        loadCustomerTable();
        $('#customer_reset_btn').trigger('click');
    }

    // get customer data by id
    const getCustomerDataById = (id) => {
        return customer_db_array.findIndex((item,index) => item.id == id);
    }

    // load customer data
    $('#customer_tbody').on('click', 'tr', function () {
        let obj = customer_db_array[$(this).index()];

        $('#customer_id_input').val(obj.id);
        $('#customer_name_input').val(obj.name);
        $('#customer_phone_input').val(obj.phone);
        $('#customer_address_input').val(obj.address);
    })

    // customer reset
    $('#customer_reset_btn').on('click', function(){
        $('#customer_id_input').val("");
        $('#customer_name_input').val("");
        $('#customer_phone_input').val("");
        $('#customer_address_input').val("");
    })
</script>
</body>
</html>
